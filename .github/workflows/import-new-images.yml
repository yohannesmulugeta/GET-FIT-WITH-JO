name: Import approved visual redesign
on:
  push:
    paths:
      - '.github/workflows/import-new-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download and validate project archive
        env:
          ARCHIVE_URL: https://at.adobe.com/lQIsRvpwC0jxN5Ck
          ARCHIVE_SHA256: 7b4db3351e22c23d4c2b46642819c2f143b4be55782ec31bf175b562f63b9b94
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$ARCHIVE_URL" -o /tmp/site.zip
          echo "$ARCHIVE_SHA256  /tmp/site.zip" | sha256sum --check --status
          unzip -tq /tmp/site.zip
          mkdir -p /tmp/staged-site
          unzip -q /tmp/site.zip -d /tmp/staged-site
          test -s /tmp/staged-site/getfitwithjo_rebuild/index.html
          test -s /tmp/staged-site/getfitwithjo_rebuild/styles.css
          test -s /tmp/staged-site/getfitwithjo_rebuild/assets/joseph-hero-pro.webp
          test -s /tmp/staged-site/getfitwithjo_rebuild/assets/joseph-avatar-pro.webp
      - name: Publish updated page and images to main
        run: |
          set -euo pipefail
          cp -a /tmp/staged-site/getfitwithjo_rebuild/. .
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          html = (root/'index.html').read_text()
          image_refs = set(re.findall(r'assets/[A-Za-z0-9._-]+', html))
          missing = [ref for ref in image_refs if not (root/ref).is_file()]
          if missing:
              raise SystemExit('Missing assets referenced in index: '+str(missing))
          assert 'joseph-hero-pro.webp' in html
          assert 'joseph-strength-pro.webp' in html
          assert 'joseph-nutrition-pro.webp' in html
          readme = root/'README.md'
          txt=readme.read_text()
          txt += '\n## Updated professional visual concepts (October 2026)\n\nThe `joseph-*-pro.webp` assets, including the hero, coaching, strength, nutrition, outdoor, about and avatar portraits, are AI-generated creative illustrations. Joseph must approve his likeness before representing them as official branding. These scenes are not evidence of actual client sessions or facilities. Original JPEG and MP4 assets remain archived in `assets/`.\n'
          readme.write_text(txt)
          print('Validated all referenced assets and updated disclosure.')
          PY
          git add -A index.html styles.css script.js README.md robots.txt sitemap.xml assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Update Get Fit with JO with professional coaching imagery"
            git push origin HEAD:main
          fi
