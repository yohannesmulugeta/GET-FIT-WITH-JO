name: Import restored coaching website content
on:
  push:
    paths:
      - '.github/workflows/import-restored-content.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Retrieve and verify content restoration package
        env:
          SOURCE_URL: https://at.adobe.com/JnJiNKo6wIcKLkGu
          PACKAGE_SHA256: 8ec471cd8d91155809e1e692e0a0ad6293e54d2543a83509cab76286c1678742
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$SOURCE_URL" -o /tmp/getfit-content.zip
          echo "$PACKAGE_SHA256  /tmp/getfit-content.zip" | sha256sum --check
          unzip -tq /tmp/getfit-content.zip
          mkdir -p /tmp/getfit-content
          unzip -q /tmp/getfit-content.zip -d /tmp/getfit-content
          test -s /tmp/getfit-content/getfitwithjo_rebuild/about.html
          test -s /tmp/getfit-content/getfitwithjo_rebuild/CONTENT_RESTORATION.md
          test -s /tmp/getfit-content/getfitwithjo_rebuild/test_site.py
      - name: Restore validated site content and preserve existing media
        run: |
          set -euo pipefail
          for name in index.html about.html styles.css build_site.py sitemap.xml test_site.py CONTENT_RESTORATION.md; do
            cp "/tmp/getfit-content/getfitwithjo_rebuild/$name" "./$name"
          done
          cat >> README.md <<'MARKDOWN'

          ## Restored coaching content (2026-10-14)
          The original sport-science statement, biography and family sports history, all seven services, six target audiences, package formats, client-progress example, social discovery and a dedicated About page have been restored.
          No archival photos or videos or brand colors were replaced. Confirm the 14-year versus four-year experience wording, pricing, testimonial publication permissions and official social handles with Joseph before advertising.
          See CONTENT_RESTORATION.md for the full provenance and confirmation list.
          MARKDOWN
          python3 test_site.py
          node --check script.js
          python3 build_site.py
          test -s dist/index.html
          test -s dist/about.html
          test -s dist/assets/joseph-hero-fast.webp
          git add -A -- index.html about.html styles.css build_site.py sitemap.xml test_site.py CONTENT_RESTORATION.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Restored content already committed"
          else
            git commit -m "Restore Joseph biography, seven services, audiences, client proof and socials"
            git push origin HEAD:main
          fi
