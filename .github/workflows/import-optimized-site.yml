name: Import performance optimization
on:
  push:
    paths:
      - '.github/workflows/import-optimized-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Retrieve and verify optimized website package
        env:
          SOURCE_URL: https://at.adobe.com/M2m0MK62kuBqUqdQ
          PACKAGE_SHA256: bdd525b569952bb8c8b77dc5bf57667aa61105d28dd7fc532bdab36cfa80a4ff
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_URL" --output /tmp/getfit-speed.zip
          echo "$PACKAGE_SHA256  /tmp/getfit-speed.zip" | sha256sum --check
          unzip -tq /tmp/getfit-speed.zip
          mkdir -p /tmp/getfit-staged
          unzip -q /tmp/getfit-speed.zip -d /tmp/getfit-staged
          test -s /tmp/getfit-staged/getfitwithjo_rebuild/index.html
          test -s /tmp/getfit-staged/getfitwithjo_rebuild/assets/joseph-hero-mobile-fast.webp
          test -s /tmp/getfit-staged/getfitwithjo_rebuild/test_site.py
          test -s /tmp/getfit-staged/getfitwithjo_rebuild/build_site.py
      - name: Apply optimized site and run checks
        run: |
          set -euo pipefail
          cp -a /tmp/getfit-staged/getfitwithjo_rebuild/. .
          # Remove superseded generated concepts; NEVER remove supplied originals.
          rm -f assets/joseph-*-concept.webp assets/joseph-*-pro.webp assets/joseph-avatar.webp
          printf 'dist/\n__pycache__/\n' > .gitignore
          python3 test_site.py
          node --check script.js
          python3 build_site.py
          test -s dist/index.html
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Already optimized"
          else
            git commit -m "Optimize mobile load times, image delivery, CSS and accessible UX"
            git push origin HEAD:main
          fi
