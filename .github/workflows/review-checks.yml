name: Review Get Fit with JO updates
on:
  push:
    branches:
      - feat/gallery-faq-booking-review-20261020
  pull_request:
    paths:
      - 'index.html'
      - 'about.html'
      - 'styles.css'
      - 'test_site.py'
      - 'script.js'
      - 'motion.js'
      - 'videos.json'
      - 'video_gallery.py'
      - 'test_video_gallery.py'
      - 'build_site.py'
      - 'assets/**'
      - '.github/workflows/review-checks.yml'
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run source integrity tests
        run: |
          python3 video_gallery.py
          python3 test_site.py
          python3 -m unittest test_video_gallery.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check script.js
          node --check motion.js
      - name: Build published site without deployment
        run: |
          python3 build_site.py
          test -s dist/index.html
          test -s dist/about.html
          test -s dist/assets/joseph-hero-mobile-fast.webp
      - name: Browser-test the built site before merging
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jo-site-test.log 2>&1) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_PATH="$(which google-chrome-stable || which google-chrome || which chromium-browser)"
          export CHROME_PATH
          SITE_URL=http://127.0.0.1:8765/ node tests/browser-smoke.mjs
      - name: Check consultation, gallery and public content
        run: |
          grep -q 'id="consultation"' dist/index.html
          grep -q 'id="enquiry-date"' dist/index.html
          if grep -Eq 'id="payments"|data-copy-number=' dist/index.html dist/about.html; then exit 1; fi
          test ! -e dist/assets/payment-telebirr.svg
          grep -q 'assets/videos/' dist/index.html
          ! grep -Eqi '<img[^>]+src="https?://' dist/index.html
